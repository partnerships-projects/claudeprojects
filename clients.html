<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Dashboard — Agency Automation</title>
    <style>
        :root {
            --bg-primary: #0f1117;
            --bg-secondary: #1a1d29;
            --bg-card: #1e2235;
            --bg-card-hover: #252a40;
            --border: #2a2f45;
            --text-primary: #e8eaf0;
            --text-secondary: #8b8fa3;
            --text-muted: #5c6078;
            --accent-blue: #4f8df5;
            --accent-green: #34d399;
            --accent-red: #f87171;
            --accent-yellow: #fbbf24;
            --accent-purple: #a78bfa;
            --accent-cyan: #22d3ee;
            --accent-orange: #fb923c;
            --accent-pink: #f472b6;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.5;
            overflow-x: hidden;
        }

        /* ── Navigation ── */
        .nav {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            padding: 0 40px;
            display: flex;
            align-items: center;
            height: 56px;
            gap: 32px;
        }

        .nav-brand {
            font-size: 17px;
            font-weight: 800;
            color: var(--text-primary);
            letter-spacing: -0.3px;
            margin-right: 24px;
            text-decoration: none;
        }

        .nav a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            padding: 16px 4px;
            border-bottom: 2px solid transparent;
            transition: all 0.15s;
        }

        .nav a:hover { color: var(--text-primary); }
        .nav a.active {
            color: var(--accent-blue);
            border-bottom-color: var(--accent-blue);
        }

        /* ── Main Layout ── */
        .page {
            max-width: 1440px;
            margin: 0 auto;
            padding: 32px 40px;
            transition: margin-right 0.3s ease;
        }

        .page.peek-open {
            margin-right: 520px;
        }

        .page-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            margin-bottom: 28px;
        }

        .page-header h1 {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 4px;
        }

        .page-header p {
            color: var(--text-secondary);
            font-size: 14px;
        }

        /* ── Summary Strip ── */
        .summary-strip {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 16px 20px;
            border: 1px solid var(--border);
        }

        .summary-item {
            flex: 1;
            text-align: center;
            padding: 0 12px;
            border-right: 1px solid var(--border);
        }

        .summary-item:last-child { border-right: none; }

        .summary-item .label {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 4px;
        }

        .summary-item .value {
            font-size: 22px;
            font-weight: 700;
        }

        /* ── Controls Bar ── */
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            align-items: center;
        }

        .search-input {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 9px 14px;
            color: var(--text-primary);
            font-size: 13px;
            width: 260px;
            outline: none;
            transition: border-color 0.15s;
        }

        .search-input::placeholder { color: var(--text-muted); }
        .search-input:focus { border-color: var(--accent-blue); }

        .filter-btn {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 9px 16px;
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
        }

        .filter-btn:hover { background: var(--bg-card-hover); color: var(--text-primary); }
        .filter-btn.active { background: rgba(79, 141, 245, 0.12); color: var(--accent-blue); border-color: rgba(79, 141, 245, 0.3); }

        .controls-right { margin-left: auto; }

        /* ── Client Table ── */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 24px;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
        }

        .data-table th {
            text-align: left;
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.6px;
            padding: 10px 12px;
            border-bottom: 1px solid var(--border);
            font-weight: 600;
        }

        .data-table td {
            padding: 14px 12px;
            font-size: 13px;
            border-bottom: 1px solid rgba(42, 47, 69, 0.5);
            color: var(--text-primary);
        }

        .data-table tbody tr {
            cursor: pointer;
            transition: background 0.1s;
        }

        .data-table tbody tr:hover {
            background: rgba(79, 141, 245, 0.06);
        }

        .data-table tbody tr.selected {
            background: rgba(79, 141, 245, 0.1);
        }

        .client-name {
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .client-avatar {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 700;
            color: #fff;
            flex-shrink: 0;
        }

        .status-pill {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        .status-active { background: rgba(52, 211, 153, 0.12); color: var(--accent-green); }
        .status-onboarding { background: rgba(79, 141, 245, 0.12); color: var(--accent-blue); }
        .status-paused { background: rgba(251, 191, 36, 0.12); color: var(--accent-yellow); }
        .status-churned { background: rgba(248, 113, 113, 0.12); color: var(--accent-red); }
        .status-lead { background: rgba(167, 139, 250, 0.12); color: var(--accent-purple); }

        .num { font-variant-numeric: tabular-nums; font-weight: 600; }

        /* ── Side Peek Panel ── */
        .peek-overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 90;
        }

        .peek-overlay.open { display: block; }

        .peek-panel {
            position: fixed;
            top: 0;
            right: -520px;
            width: 520px;
            height: 100vh;
            background: var(--bg-secondary);
            border-left: 1px solid var(--border);
            z-index: 100;
            transition: right 0.3s ease;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .peek-panel.open { right: 0; }

        .peek-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: flex-start;
            gap: 14px;
            flex-shrink: 0;
        }

        .peek-avatar {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 700;
            color: #fff;
            flex-shrink: 0;
        }

        .peek-title-block { flex: 1; }

        .peek-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .peek-subtitle {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .peek-close {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 20px;
            cursor: pointer;
            padding: 4px;
            line-height: 1;
            transition: color 0.15s;
        }

        .peek-close:hover { color: var(--text-primary); }

        /* ── Peek Tabs ── */
        .peek-tabs {
            display: flex;
            border-bottom: 1px solid var(--border);
            padding: 0 24px;
            flex-shrink: 0;
        }

        .peek-tab {
            padding: 12px 16px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.15s;
        }

        .peek-tab:hover { color: var(--text-secondary); }

        .peek-tab.active {
            color: var(--accent-blue);
            border-bottom-color: var(--accent-blue);
        }

        .peek-body {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px;
        }

        /* ── Peek Content ── */
        .peek-section {
            margin-bottom: 24px;
        }

        .peek-section-title {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.6px;
            margin-bottom: 12px;
        }

        .peek-kpi-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .peek-kpi {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 14px;
            text-align: center;
        }

        .peek-kpi .pk-value {
            font-size: 22px;
            font-weight: 800;
        }

        .peek-kpi .pk-label {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 2px;
        }

        .peek-info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .peek-info-item {
            padding: 10px 12px;
            background: var(--bg-card);
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .peek-info-item .pi-label {
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 2px;
        }

        .peek-info-item .pi-value {
            font-size: 13px;
            font-weight: 600;
        }

        /* ── Project cards in peek ── */
        .project-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 10px;
        }

        .project-card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .project-name {
            font-size: 14px;
            font-weight: 600;
        }

        .project-meta {
            display: flex;
            gap: 16px;
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 10px;
        }

        .project-meta span {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255,255,255,0.06);
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.6s ease;
        }

        .progress-label {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* ── Feedback items in peek ── */
        .feedback-item {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 10px;
        }

        .feedback-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .feedback-date {
            font-size: 12px;
            color: var(--text-muted);
        }

        .feedback-rating {
            display: flex;
            gap: 2px;
        }

        .star { color: var(--accent-yellow); font-size: 14px; }
        .star.empty { color: var(--text-muted); }

        .feedback-text {
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.6;
        }

        .feedback-type {
            display: inline-block;
            margin-top: 8px;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            background: rgba(167, 139, 250, 0.12);
            color: var(--accent-purple);
        }

        /* ── Timeline in peek ── */
        .timeline-item {
            display: flex;
            gap: 12px;
            padding: 10px 0;
            border-bottom: 1px solid rgba(42, 47, 69, 0.4);
        }

        .timeline-item:last-child { border-bottom: none; }

        .timeline-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-top: 6px;
            flex-shrink: 0;
        }

        .timeline-content {
            flex: 1;
        }

        .timeline-text {
            font-size: 13px;
            color: var(--text-primary);
        }

        .timeline-date {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .empty-state {
            text-align: center;
            padding: 32px;
            color: var(--text-muted);
            font-size: 13px;
        }

        /* ── Responsive ── */
        @media (max-width: 1200px) {
            .page.peek-open { margin-right: 0; }
            .peek-panel { width: 100%; right: -100%; }
        }

        @media (max-width: 768px) {
            .page { padding: 20px 16px; }
            .nav { padding: 0 16px; gap: 16px; }
            .summary-strip { flex-direction: column; }
            .summary-item { border-right: none; border-bottom: 1px solid var(--border); padding: 10px 0; }
            .summary-item:last-child { border-bottom: none; }
            .controls { flex-wrap: wrap; }
            .search-input { width: 100%; }
        }

        /* scrollbar */
        .peek-body::-webkit-scrollbar { width: 6px; }
        .peek-body::-webkit-scrollbar-track { background: transparent; }
        .peek-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    </style>
</head>

// =============================================================================
// HELPERS
// =============================================================================
function fmtNum(n) { return n.toLocaleString(); }
function fmtMoney(n) { return '$' + n.toLocaleString(); }
function fmtDate(d) {
    return new Date(d).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}
function daysAgo(d) {
    const diff = Math.floor((new Date() - new Date(d)) / 86400000);
    if (diff === 0) return 'Today';
    if (diff === 1) return 'Yesterday';
    if (diff < 7) return diff + 'd ago';
    if (diff < 30) return Math.floor(diff / 7) + 'w ago';
    return Math.floor(diff / 30) + 'mo ago';
}
function initials(name) {
    return name.split(' ').map(w => w[0]).join('').substring(0, 2).toUpperCase();
}
function avgRating(clientId) {
    const fb = FEEDBACK.filter(f => f.clientId === clientId);
    if (!fb.length) return 0;
    return fb.reduce((s, f) => s + f.rating, 0) / fb.length;
}
function stars(rating) {
    let s = '';
    for (let i = 1; i <= 5; i++) {
        s += `<span class="star${i > Math.round(rating) ? ' empty' : ''}">&#9733;</span>`;
    }
    return s;
}

function getClientProjects(clientId) { return PROJECTS.filter(p => p.clientId === clientId); }
function getClientFeedback(clientId) { return FEEDBACK.filter(f => f.clientId === clientId).sort((a, b) => new Date(b.date) - new Date(a.date)); }

function projectStatusColor(status) {
    const map = { active: '--accent-green', planning: '--accent-blue', paused: '--accent-yellow', completed: '--accent-purple' };
    return `var(${map[status] || '--text-muted'})`;
}

function projectStatusPill(status) {
    const cls = { active: 'status-active', planning: 'status-onboarding', paused: 'status-paused', completed: 'status-lead' };
    return `<span class="status-pill ${cls[status] || ''}">${status}</span>`;
}

// =============================================================================
let currentFilter = 'all';
let currentSearch = '';
let selectedClientId = null;

function filteredClients() {
    return CLIENTS.filter(c => {
        if (currentFilter !== 'all' && c.status !== currentFilter) return false;
        if (currentSearch && !c.name.toLowerCase().includes(currentSearch) && !c.contact.toLowerCase().includes(currentSearch)) return false;
        return true;
    });
}

function renderTable() {
    const tbody = document.getElementById('client-table-body');
    const clients = filteredClients();

    tbody.innerHTML = clients.map(c => {
        const projects = getClientProjects(c.id);
        const rating = avgRating(c.id);
        return `
            <tr data-id="${c.id}" class="${selectedClientId === c.id ? 'selected' : ''}" onclick="openPeek(${c.id})">
                <td>
                    <div class="client-name">
                        <div class="client-avatar" style="background:${c.color};">${initials(c.name)}</div>
                        <div>
                            <div>${c.name}</div>
                            <div style="font-weight:400;font-size:12px;color:var(--text-muted);">${c.contact}</div>
                        </div>
                    </div>
                </td>
                <td><span class="status-pill status-${c.status}">${c.status}</span></td>
                <td class="num">${projects.length}</td>
                <td>${rating > 0 ? stars(rating) : '<span style="color:var(--text-muted);">—</span>'}</td>
                <td class="num">${c.retainer > 0 ? fmtMoney(c.retainer) + '/mo' : '—'}</td>
                <td style="color:var(--text-secondary);">${fmtDate(c.since)}</td>
                <td style="color:var(--text-secondary);">${daysAgo(c.lastActivity)}</td>
            </tr>
        `;
    }).join('');
}

let currentTab = 'overview';

function openPeek(clientId) {
    selectedClientId = clientId;
    currentTab = 'overview';
    const panel = document.getElementById('peek-panel');
    const overlay = document.getElementById('peek-overlay');
    const page = document.getElementById('main-page');

    panel.classList.add('open');
    overlay.classList.add('open');
    page.classList.add('peek-open');

    renderPeekHeader(clientId);
    renderPeekTabs();
    renderPeekBody(clientId);
    renderTable();
}

function closePeek() {
    selectedClientId = null;
    document.getElementById('peek-panel').classList.remove('open');
    document.getElementById('peek-overlay').classList.remove('open');
    document.getElementById('main-page').classList.remove('peek-open');
    renderTable();
}

document.getElementById('search').addEventListener('input', (e) => {
    currentSearch = e.target.value.toLowerCase();
    renderTable();
});

document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        renderTable();
    });
});

document.querySelectorAll('.peek-tab').forEach(tab => {
    tab.addEventListener('click', () => {
        currentTab = tab.dataset.tab;
        renderPeekTabs();
        if (selectedClientId) renderPeekBody(selectedClientId);
    });
});

document.getElementById('peek-overlay').addEventListener('click', closePeek);

document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closePeek();
});

// =============================================================================
// INIT
// =============================================================================
renderSummary();
renderTable();
</script>
</body>
</html>
